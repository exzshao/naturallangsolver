<!doctype html>
<meta charset="utf-8">
<title>wasm memory ceiling</title>
<pre id="log"></pre>
<script type="module">
// How far can a shared wasm32 / memory64 memory grow in this browser? (pages are not touched)
const log = (s) => { document.getElementById("log").textContent += s + "\n"; console.log(s); };
const GB = 1024 ** 3, PAGE = 65536;
function tryGrow(label, make, big, targetsGB) {
  let mem;
  try { mem = make(); } catch (e) { log(`${label}: create failed: ${e}`); return; }
  let cur = 1;
  for (const gb of targetsGB) {
    const pages = gb * GB / PAGE;
    try { mem.grow(big ? BigInt(pages - cur) : pages - cur); cur = pages; log(`${label}: grew to ${gb} GB ok`); }
    catch (e) { log(`${label}: grow to ${gb} GB failed: ${e.message}`); break; }
  }
}
tryGrow("wasm32 shared", () => new WebAssembly.Memory({ initial: 1, maximum: 65536, shared: true }), false, [1, 2, 3, 4]);
tryGrow("memory64 shared", () => new WebAssembly.Memory({ initial: 1n, maximum: 262144n, address: "i64", shared: true }), true, [2, 4, 6, 8, 12, 16]);
window.__done = true;
</script>
