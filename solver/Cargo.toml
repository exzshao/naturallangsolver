[package]
name = "solver-service"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8.9"
postflop-solver = { git = "https://github.com/b-inary/postflop-solver", version = "0.1.0", default-features = false, features = ["rayon"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros"] }
tower-http = { version = "0.7.1", features = ["cors"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"

[dev-dependencies]
http-body-util = "0.1.5"
tower = { version = "0.5.3", features = ["util"] }
